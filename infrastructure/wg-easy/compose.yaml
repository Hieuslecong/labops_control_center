services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15@sha256:071f79a639e9361123a5e57733107320207b844ddbbd92dfa6962f541fe8aac8
    container_name: labops-wg-easy
    environment:
      - INSECURE=true
      - PORT=51821
      - INIT_ENABLED=true
      - INIT_USERNAME=${WG_EASY_ADMIN_USER:-admin}
      - INIT_PASSWORD=${WG_EASY_ADMIN_PASSWORD:?WG_EASY_ADMIN_PASSWORD must be provided at deploy time}
      - INIT_HOST=${WG_EASY_PUBLIC_ENDPOINT_HOST:-118.70.169.236}
      - INIT_PORT=${WG_EASY_UDP_PORT:-2204}
      - INIT_DNS=1.1.1.1
      - INIT_IPV4_CIDR=${WG_EASY_VPN_SUBNET:-10.88.40.0/24}
      - INIT_IPV6_CIDR=${WG_EASY_VPN_IPV6_SUBNET:-fdcc:ad94:bacf:61a4::cafe:0/112}
    volumes:
      - wg_easy_data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      # Port UDP WireGuard duy nhất: cấu hình qua WG_EASY_UDP_PORT (mặc định 2204)
      # LƯU Ý: INIT_* chỉ có hiệu lực ở lần khởi tạo đầu; đổi CIDR sau đó phải qua API chính thức
      # (POST /api/admin/interface/cidr) KÈM POST /api/admin/interface/restart.
      - "${WG_EASY_UDP_PORT:-2204}:${WG_EASY_UDP_PORT:-2204}/udp"
      # Port Web API quản trị - CHỈ bind vào loopback 127.0.0.1 để LabOps Backend gọi nội bộ, KHÔNG mở ra Internet
      - "127.0.0.1:51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:51821/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  wg_easy_data:
    name: labops_wg_easy_data


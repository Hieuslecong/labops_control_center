version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: labops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labops_secret}
      POSTGRES_DB: ${POSTGRES_DB:-labops_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labops} -d ${POSTGRES_DB:-labops_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labops-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROJECT_NAME: "LabOps Control Center API"
      VERSION: "1.0.0"
      API_V1_STR: "/api/v1"
      LABOPS_MODE: ${LABOPS_MODE:-production}
      LABOPS_ALLOW_MOCK_DATA: ${LABOPS_ALLOW_MOCK_DATA:-false}
      LABOPS_ADMIN_API_TOKEN: ${LABOPS_ADMIN_API_TOKEN:-}
      LOCAL_HOST_ID: ${LOCAL_HOST_ID:-workstation}
      WIREGUARD_SERVERS_JSON: ${WIREGUARD_SERVERS_JSON:-}
      TELEPORT_TCTL_PATH: ${TELEPORT_TCTL_PATH:-tctl}
      TELEPORT_PUBLIC_ADDR: ${TELEPORT_PUBLIC_ADDR:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-labops}:${POSTGRES_PASSWORD:-labops_secret}@postgres:5432/${POSTGRES_DB:-labops_db}
      TRACK_SERVER_URL: ${TRACK_SERVER_URL:-https://10.10.1.10:8443}
      WORKSTATION_SERVER_URL: ${WORKSTATION_SERVER_URL:-https://10.10.2.20:8443}
      NETDATA_TRACK_URL: ${NETDATA_TRACK_URL:-http://10.200.0.1:19999}
      NETDATA_WS_URL: ${NETDATA_WS_URL:-http://10.200.0.2:19999}
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.bun
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        BUILD_STANDALONE: "true"
    container_name: labops-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      LABOPS_BACKEND_URL: http://backend:8000/api/v1
      LABOPS_ADMIN_API_TOKEN: ${LABOPS_ADMIN_API_TOKEN:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local


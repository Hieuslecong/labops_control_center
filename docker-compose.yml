version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: labops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labops_secret}
      POSTGRES_DB: ${POSTGRES_DB:-labops_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labops} -d ${POSTGRES_DB:-labops_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labops-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROJECT_NAME: "LabOps Control Center API"
      VERSION: "1.0.0"
      API_V1_STR: "/api/v1"
      DEMO_MODE: ${DEMO_MODE:-true}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-labops}:${POSTGRES_PASSWORD:-labops_secret}@postgres:5432/${POSTGRES_DB:-labops_db}
      TRACK_SERVER_URL: ${TRACK_SERVER_URL:-https://10.10.1.10:8443}
      WORKSTATION_SERVER_URL: ${WORKSTATION_SERVER_URL:-https://10.10.2.20:8443}
      NETDATA_TRACK_URL: ${NETDATA_TRACK_URL:-http://10.200.0.1:19999}
      NETDATA_WS_URL: ${NETDATA_WS_URL:-http://10.200.0.2:19999}
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.bun
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        BUILD_STANDALONE: "true"
    container_name: labops-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local

